<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sr. Doggy — Contabilidad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f2ecce; min-height: 100vh; }
  
  /* Header */
  .header { background: linear-gradient(135deg, #2d5016 0%, #3a5f1c 50%, #4a7c2e 100%); padding: 24px 28px 20px; border-bottom: 3px solid #d4a017; }
  .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .header-logo { width: 44px; height: 44px; border-radius: 12px; background: #d4a017; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 2px 8px #00000033; }
  .header h1 { color: #f5e6a3; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .header p { color: #b8c9a0; font-size: 12px; font-weight: 500; margin-top: 2px; }
  
  /* Month Nav */
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; background: #ffffff11; border-radius: 10px; padding: 8px 0; }
  .month-nav button { background: none; border: none; color: #f5e6a3; font-size: 22px; cursor: pointer; padding: 4px 14px; transition: transform .15s; }
  .month-nav button:hover { transform: scale(1.2); }
  .month-nav span { color: #f5e6a3; font-size: 16px; font-weight: 700; min-width: 180px; text-align: center; }
  
  /* Tabs */
  .tabs { display: flex; gap: 4px; padding: 12px 20px; overflow-x: auto; background: #eae4c4; border-bottom: 1px solid #d4c98a; }
  .tabs::-webkit-scrollbar { height: 0; }
  .tab-btn { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border: none; border-radius: 10px; background: transparent; color: #6b7c5e; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap; }
  .tab-btn.active { background: #2d5016; color: #f5e6a3; }
  .tab-btn:hover:not(.active) { background: #ddd8b8; }
  .tab-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  
  /* Content */
  .content { padding: 20px; max-width: 960px; margin: 0 auto; }
  .section-title { font-size: 16px; font-weight: 700; color: #2d3a1e; margin-bottom: 14px; }
  
  /* Inputs */
  .cop-input, .text-input, .select-input {
    padding: 8px 10px; border: 1px solid #d4c98a; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    background: #fefdf5; color: #2d3a1e; outline: none; width: 100%;
  }
  .cop-input { font-family: 'JetBrains Mono', monospace; text-align: right; }
  .cop-input:focus, .text-input:focus, .select-input:focus { border-color: #4a7c2e; box-shadow: 0 0 0 2px #4a7c2e22; }
  .select-input { cursor: pointer; }
  
  /* Buttons */
  .btn-primary { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #3a5f1c; color: #f5e6a3; border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; transition: background .2s; }
  .btn-primary:hover { background: #2d5016; }
  .btn-delete { width: 30px; height: 30px; border: none; border-radius: 6px; background: #f5d5d5; color: #8b1a1a; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  .btn-delete:hover { background: #e8b8b8; }
  
  /* Cards */
  .summary-card { border-radius: 12px; padding: 18px 20px; }
  .summary-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; opacity: .7; }
  .summary-card .value { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 6px; }
  
  /* Grid table */
  .ventas-grid { display: grid; grid-template-columns: 60px 1fr 1fr 1fr 90px; gap: 1px; background: #c9bf8a; border-radius: 12px; overflow: hidden; border: 2px solid #c9bf8a; }
  .ventas-grid .gh { padding: 10px 8px; background: #3a5f1c; color: #f5e6a3; font-size: 12px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
  .ventas-grid .gc { padding: 3px; display: flex; align-items: center; justify-content: center; }
  .ventas-grid .gc.day-cell { flex-direction: column; font-size: 14px; font-weight: 700; color: #2d3a1e; padding: 6px 8px; }
  .ventas-grid .gc.day-cell .dn { font-size: 9px; color: #8a9670; text-transform: uppercase; }
  .ventas-grid .gc input { width: 100%; }
  
  /* Row items */
  .row-item { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: #fefdf5; border-radius: 10px; border: 1px solid #e5ddb5; margin-bottom: 8px; flex-wrap: wrap; }
  .row-item .field { flex: 1; min-width: 100px; }
  .row-item .field-sm { width: 70px; flex-shrink: 0; }
  .row-item .field-md { width: 140px; flex-shrink: 0; }
  
  /* Fijo item */
  .fijo-item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: #fefdf5; border-radius: 10px; border: 1px solid #e5ddb5; margin-bottom: 10px; }
  .fijo-item .name-input { flex: 1; font-weight: 600; font-size: 14px; }
  .fijo-item .val-input { width: 180px; }
  
  /* Total bars */
  .total-bar { border-radius: 10px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .total-bar .tl { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .total-bar .tv { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
  
  /* Totals row */
  .totals-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 16px; }
  .total-card { border-radius: 10px; padding: 14px 16px; text-align: center; color: #f5e6a3; }
  .total-card .tc-label { font-size: 11px; opacity: .8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .total-card .tc-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; margin-top: 4px; }
  
  /* Summary grid */
  .sum-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .sum-grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
  .sum-section-label { font-size: 12px; color: #6b7c5e; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
  
  .utilidad-bar { border-radius: 14px; padding: 24px 28px; display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .utilidad-bar .u-label { font-size: 12px; color: #ffffff99; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
  .utilidad-bar .u-val { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; color: #fff; margin-top: 6px; }
  .utilidad-bar .u-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #ffffff22; font-size: 28px; }
  
  .detail-row { display: flex; justify-content: space-between; padding: 10px 14px; background: #fefdf5; border-radius: 8px; border: 1px solid #e5ddb5; margin-bottom: 6px; }
  .detail-row .dr-name { font-size: 13px; color: #2d3a1e; font-weight: 500; }
  .detail-row .dr-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; }
  
  .empty-state { text-align: center; padding: 40px; color: #8a9670; font-size: 14px; background: #f5f0d8; border-radius: 12px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .caja-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }

  /* Arqueo de caja */
  .arqueo-grid { display: grid; grid-template-columns: 1.2fr 90px 1.3fr; gap: 1px; background: #c9bf8a; border-radius: 12px; overflow: hidden; border: 2px solid #c9bf8a; }
  .arqueo-grid .agh { padding: 10px 8px; background: #3a5f1c; color: #f5e6a3; font-size: 11px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
  .arqueo-grid .agc { padding: 6px 10px; background: #fefdf5; display: flex; align-items: center; }
  .arqueo-grid .ag-sep { grid-column: 1/-1; background: #f0ead0; padding: 5px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #8a9670; }

  /* Dashboard */
  .dash-card { background: #fefdf5; border: 1px solid #e5ddb5; border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .dash-card-title { font-size: 12px; color: #6b7c5e; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dash-card-title small { font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 500; color: #8a9670; }
  .dash-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .dash-kpi { background: #fefdf5; border: 1px solid #e5ddb5; border-radius: 12px; padding: 14px 16px; }
  .dash-kpi .k-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6b7c5e; }
  .dash-kpi .k-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #2d3a1e; margin-top: 6px; white-space: nowrap; }
  .dash-kpi .k-sub { font-size: 11px; color: #8a9670; margin-top: 3px; }
  .dash-progress { height: 8px; background: #efe8c8; border-radius: 4px; overflow: hidden; margin: 8px 0 6px; }
  .dash-progress > div { height: 100%; background: #3a5f1c; border-radius: 4px; }
  .dash-stack { position: relative; display: flex; gap: 2px; height: 34px; border-radius: 6px; overflow: hidden; background: #efe8c8; }
  .dash-stack .seg { min-width: 2px; height: 100%; }
  .dash-stack-wrap { position: relative; }
  .dash-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: #2d3a1e; }
  .dash-mark span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: #2d3a1e; white-space: nowrap; }
  .dash-legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .dash-legend .lg { display: flex; gap: 8px; align-items: flex-start; }
  .dash-sw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; margin-top: 2px; }
  .dash-legend .lg-name { font-size: 12px; font-weight: 600; color: #2d3a1e; }
  .dash-legend .lg-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #2d3a1e; }
  .dash-legend .lg-pct { font-size: 11px; color: #8a9670; }
  .dash-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .dash-cat { background: #fefdf5; border: 1px solid #e5ddb5; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; }
  .dash-cat-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #2d3a1e; }
  .dash-cat-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: #2d3a1e; margin: 8px 0 4px; }
  .dash-track { height: 6px; background: #efe8c8; border-radius: 3px; overflow: hidden; }
  .dash-track > div { height: 100%; border-radius: 3px; }
  .dash-cat-pct { font-size: 11px; color: #6b7c5e; margin: 6px 0 10px; }
  .dash-items { border-top: 1px solid #efe8c8; padding-top: 8px; flex: 1; }
  .dash-item { margin-bottom: 7px; }
  .dash-item-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #2d3a1e; }
  .dash-item-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-item-row .v { font-family: 'JetBrains Mono', monospace; font-weight: 600; white-space: nowrap; }
  .dash-item .dash-track { height: 3px; margin-top: 3px; }
  .dash-link { margin-top: 8px; background: none; border: none; color: #3a5f1c; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; text-align: left; padding: 0; }
  .dash-chart { position: relative; }
  .dash-chart svg { display: block; overflow: visible; }
  .dash-tip { position: absolute; pointer-events: none; background: #2d3a1e; color: #f5e6a3; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap; display: none; box-shadow: 0 4px 12px #00000033; z-index: 2; }
  .dash-tip b { font-family: 'JetBrains Mono', monospace; }
  .dash-chart-legend { display: flex; gap: 16px; font-size: 12px; color: #2d3a1e; margin-bottom: 8px; flex-wrap: wrap; }
  .dash-chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dash-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .dash-trio .t-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6b7c5e; }
  .dash-trio .t-val { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #2d3a1e; margin-top: 3px; white-space: nowrap; }
  .dash-trio .t-sub { font-size: 11px; color: #8a9670; }
  .dash-alert { font-size: 12px; font-weight: 600; color: #8b1a1a; background: #fce8e8; border-radius: 8px; padding: 8px 12px; margin-top: 12px; }

  @media (max-width: 700px) {
    .dash-kpis, .dash-legend { grid-template-columns: 1fr 1fr; }
    .dash-cats, .dash-trio { grid-template-columns: 1fr; }
    .dash-kpi .k-val { font-size: 17px; }
    .ventas-grid { grid-template-columns: 50px 1fr 1fr 80px; }
    .ventas-grid .gh:nth-child(4), .ventas-grid .gc.notes-cell { display: none; }
    .totals-row { grid-template-columns: 1fr; }
    .sum-grid3, .sum-grid4 { grid-template-columns: 1fr 1fr; }
    .caja-grid { grid-template-columns: 1fr; }
    .arqueo-grid { grid-template-columns: 1fr 74px 1.1fr; }
    .tabs { gap: 2px; padding: 10px 12px; }
    .tab-btn { padding: 8px 12px; font-size: 12px; }
    .tab-btn .tab-text { display: none; }
    .content { padding: 14px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="header-logo">🌭</div>
    <div>
      <h1>Sr. Doggy</h1>
      <p>Contabilidad & Control</p>
    </div>
  </div>
  <div class="month-nav">
    <button onclick="prevMonth()">‹</button>
    <span id="monthLabel"></span>
    <button onclick="nextMonth()">›</button>
  </div>
  <div style="text-align:center;margin-top:8px">
    <button onclick="exportarMesJSON()" title="Descargar todos los datos de este mes en un archivo JSON para analizarlo en Claude" style="background:#f5e6a3;border:none;color:#1a1205;font-size:12px;font-weight:700;cursor:pointer;padding:8px 16px;border-radius:20px;">⬇️ Exportar mes (JSON)</button>
  </div>
  <div style="text-align:center;margin-top:8px;font-size:11px;font-weight:600">
    <span id="sync-indicator" style="color:#b8c9a0">↻ Cargando...</span>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('ventas', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
    <span class="tab-text">Ventas Diarias</span>
  </button>
  <button class="tab-btn" onclick="switchTab('gastos', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
    <span class="tab-text">Gastos</span>
  </button>
  <button class="tab-btn" onclick="switchTab('mercancia', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
    <span class="tab-text">Mercancía</span>
  </button>
  <button class="tab-btn" onclick="switchTab('fijos', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span class="tab-text">Gastos Fijos</span>
  </button>
  <button class="tab-btn" onclick="switchTab('caja', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><path d="M16 14h2v4h-2a2 2 0 010-4z"/></svg>
    <span class="tab-text">Caja</span>
  </button>
  <button class="tab-btn" onclick="switchTab('dashboard', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 118 2.83"/><path d="M22 12A10 10 0 0012 2v10z"/></svg>
    <span class="tab-text">Dashboard</span>
  </button>
  <button class="tab-btn" onclick="switchTab('resumen', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    <span class="tab-text">Resumen</span>
  </button>
</div>

<!-- Content -->
<div class="content">
  <div id="tab-ventas" class="tab-panel active"></div>
  <div id="tab-gastos" class="tab-panel"></div>
  <div id="tab-mercancia" class="tab-panel"></div>
  <div id="tab-fijos" class="tab-panel"></div>
  <div id="tab-caja" class="tab-panel"></div>
  <div id="tab-dashboard" class="tab-panel"></div>
  <div id="tab-resumen" class="tab-panel"></div>
</div>

<script>
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DAYS_ES = ["dom","lun","mar","mié","jue","vie","sáb"];
const STORAGE_KEY = "sr_doggy_contabilidad";
// Gastos fijos: `presupuesto` es lo que cuesta en el mes; `value` es lo YA pagado,
// que es lo unico que se resta en caja. `vence` es el dia del mes en que se paga (opcional).
// Tipos: "mensual"; "vencido" (lo que se recoge en el mes paga el del mes anterior);
// "diario" (`tarifa` x dias del mes); "quincena" (`tarifa` x `dias` de la quincena 1 = dias
// 1-15, que vence el 15, o 2 = del 16 al fin de mes, que vence el ultimo dia).
// FIJO_DEFAULTS completa filas guardadas antes de que existieran los tipos; migrarFijos las pasa al esquema actual.
const FIJO_DEFAULTS = {
  emp: { tipo: "diario", tarifa: 85000 },
  arriendo: { tipo: "mensual", presupuesto: 2848000, vence: 8 },
};
const DEFAULT_FIXED = [
  { id: "emp", name: "Empleado", value: 0, fecha: "", metodo: "efectivo", tipo: "quincena", quincena: 1, dias: "", tarifa: 85000, presupuesto: 0, vence: "" },
  { id: "emp2", name: "Empleado", value: 0, fecha: "", metodo: "efectivo", tipo: "quincena", quincena: 2, dias: "", tarifa: 85000, presupuesto: 0, vence: "" },
  { id: "luz", name: "Luz", value: 0, fecha: "", metodo: "efectivo", tipo: "mensual", presupuesto: 0, vence: "" },
  { id: "agua", name: "Agua", value: 0, fecha: "", metodo: "efectivo", tipo: "mensual", presupuesto: 0, vence: "" },
  { id: "internet", name: "Internet", value: 0, fecha: "", metodo: "bancolombia", tipo: "mensual", presupuesto: 0, vence: "" },
  { id: "arriendo", name: "Arriendo", value: 0, fecha: "", metodo: "efectivo", tipo: "vencido", presupuesto: 2848000, vence: 8 },
];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let currentTab = "ventas";
const API_URL = "";
let data = { ventas: {}, gastos: {}, mercancia: {}, fijos: {}, traslados: {} };
let syncStatus = "cargando";
let trasladoFormOpen = false;
let trasladoFormDir = 'ef_ba';

function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch { return null; }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  fetch(API_URL + "/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
    .then(r => r.ok ? setSyncStatus("ok") : setSyncStatus("error"))
    .catch(() => setSyncStatus("offline"));
}

function setSyncStatus(s) {
  syncStatus = s;
  const el = document.getElementById("sync-indicator");
  if (!el) return;
  const map = { ok: ["✓ Sincronizado", "#4a7c2e"], offline: ["⚠ Sin conexión (guardado local)", "#b8860b"], error: ["✗ Error de sync", "#8b1a1a"], cargando: ["↻ Cargando...", "#555"] };
  const [txt, color] = map[s] || map.cargando;
  el.textContent = txt; el.style.color = color;
}

async function initData() {
  const local = loadData();
  if (local) { data = local; renderVentas(); }
  try {
    const res = await fetch(API_URL + "/data");
    if (res.ok) {
      const remote = await res.json();
      if (Object.keys(remote).length > 0) {
        data = remote;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } else if (local) {
        saveData();
      }
      setSyncStatus("ok");
    } else { setSyncStatus("offline"); }
  } catch { setSyncStatus("offline"); }
  renderVentas();
}
function fmt(n) {
  const num = parseInt(n) || 0;
  return "$" + num.toLocaleString("es-CO");
}
function fmtFecha(fecha) {
  if (!fecha) return "—";
  if (typeof fecha === "number") return `Día ${fecha}`;
  const p = fecha.split("-");
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function daysInMonth(m, y) { return new Date(y, m + 1, 0).getDate(); }
function todayLocal() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}
function getKey() { return `${currentYear}-${currentMonth}`; }
// ordena en sitio por fecha: mas reciente arriba, sin fecha al final.
// Empate de fecha: lo agregado mas recientemente arriba, para que una fila
// nueva siempre quede visible en el tope de su grupo.
function sortByFecha(arr) {
  const ts = x => { const n = parseInt(String(x.id).replace(/\D/g, ""), 10); return isNaN(n) ? 0 : n; };
  arr.sort((a, b) => {
    const fa = a.fecha || "", fb = b.fecha || "";
    if (fa !== fb) {
      if (!fa) return 1;
      if (!fb) return -1;
      return fb.localeCompare(fa);
    }
    return ts(b) - ts(a);
  });
  return arr;
}
// lleva el foco a la fila recien agregada
function focusFila(panelId, idx, sel) {
  if (idx < 0) return;
  const el = document.getElementById(panelId).querySelectorAll(sel)[idx];
  if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.focus(); }
}

function exportarMesJSON() {
  const key = getKey();
  const mesIso = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
  const secciones = {
    ventas: data.ventas?.[key] || {},
    adicionales: data.adicionales?.[key] || [],
    gastos: data.gastos?.[key] || [],
    mercancia: data.mercancia?.[key] || [],
    fijos: data.fijos?.[key] || [],
    traslados: data.traslados?.[key] || [],
    arqueos: data.arqueos?.[key] || [],
  };
  const vacio = Object.values(secciones).every(v => Array.isArray(v) ? v.length === 0 : Object.keys(v).length === 0);
  if (vacio) { alert(`No hay datos registrados para ${MONTHS[currentMonth]} ${currentYear}.`); return; }
  const payload = {
    _tipo: "export_mensual",
    fuente: "sr_doggy_contabilidad",
    mes: mesIso,
    mesNombre: `${MONTHS[currentMonth]} ${currentYear}`,
    exportado: new Date().toISOString(),
    ...secciones,
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `sr_doggy_contabilidad_${mesIso}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function updateVenta(day, field, val) {
  const key = getKey();
  if (!data.ventas[key]) data.ventas[key] = {};
  if (!data.ventas[key][day]) data.ventas[key][day] = { efectivo: 0, bancolombia: 0, notas: "" };
  data.ventas[key][day][field] = field === "notas" ? val : (parseInt(val.replace(/[^0-9-]/g,"")) || 0);
  saveData();
  renderVentas();
}

function addAdicional() {
  const key = getKey();
  if (!data.adicionales) data.adicionales = {};
  if (!data.adicionales[key]) data.adicionales[key] = [];
  data.adicionales[key].push({ id: Date.now(), fecha: todayLocal(), descripcion: '', efectivo: 0, bancolombia: 0 });
  saveData();
  renderVentas();
}

function updateAdicional(id, field, val) {
  const key = getKey();
  const item = data.adicionales?.[key]?.find(a => a.id === id);
  if (!item) return;
  item[field] = (field === 'efectivo' || field === 'bancolombia') ? (parseInt(val.replace(/[^0-9-]/g,"")) || 0) : val;
  saveData();
  if (field === 'efectivo' || field === 'bancolombia') renderVentas();
}

function deleteAdicional(id) {
  const key = getKey();
  if (!data.adicionales?.[key]) return;
  data.adicionales[key] = data.adicionales[key].filter(a => a.id !== id);
  saveData();
  renderVentas();
}

// ============ GASTOS FIJOS ============
function esMesPasado(y, m) { const h = new Date(); return y * 12 + m < h.getFullYear() * 12 + h.getMonth(); }
// dia del mes visible hasta el que ya corrio el tiempo (0 si es un mes futuro)
function diaCorrido() {
  const h = new Date(), days = daysInMonth(currentMonth, currentYear);
  const mesIdx = currentYear * 12 + currentMonth, hoyIdx = h.getFullYear() * 12 + h.getMonth();
  return mesIdx < hoyIdx ? days : mesIdx > hoyIdx ? 0 : h.getDate();
}
// completa los campos nuevos en fijos guardados antes de que existiera el presupuesto.
// En meses pasados lo pagado se toma como lo que costaba, para no inventar deudas viejas.
function normalizarFijo(item, pasado) {
  if (item.tipo) return item;
  const def = FIJO_DEFAULTS[item.id];
  if (def && !pasado) Object.assign(item, { presupuesto: 0, tarifa: 0, vence: "" }, def);
  else Object.assign(item, { tipo: "mensual", presupuesto: item.value || 0, tarifa: 0, vence: "" });
  return item;
}
// dias que se pagan en una quincena: los del calendario salvo que se hayan cambiado a mano
function fijoDias(item, days) {
  if (item.dias !== "" && item.dias != null) return item.dias;
  return item.quincena === 2 ? days - 15 : 15;
}
function fijoVence(item, days) {
  if (item.tipo === "quincena") return item.quincena === 2 ? days : 15;
  return item.tipo === "diario" ? "" : parseInt(item.vence) || "";
}
function fijoPresupuesto(item, days) {
  if (item.tipo === "diario") return (item.tarifa || 0) * days;
  if (item.tipo === "quincena") return (item.tarifa || 0) * fijoDias(item, days);
  return item.presupuesto || 0;
}
function fijoPorPagar(item, days) { return Math.max(fijoPresupuesto(item, days) - (item.value || 0), 0); }
function mesAnterior(m) { return MONTHS[(m + 11) % 12].toLowerCase(); }
// nombre con la quincena o el mes que se esta pagando, para listas fuera de la pestaña de fijos
function fijoNombre(item) {
  const n = item.name || "Sin nombre";
  if (item.tipo === "quincena") return `${n} · ${item.quincena === 2 ? 2 : 1}ª quincena`;
  if (item.tipo === "vencido") return `${n} de ${mesAnterior(currentMonth)}`;
  return n;
}
// fijos de un mes; un mes nuevo hereda la lista del mes anterior (sin lo pagado)
function fijosDe(y, m) {
  const key = `${y}-${m}`;
  if (!data.fijos) data.fijos = {};
  if (!data.fijos[key]) {
    const pm = m === 0 ? 11 : m - 1, py = m === 0 ? y - 1 : y;
    const prev = data.fijos[`${py}-${pm}`];
    data.fijos[key] = prev && prev.length
      ? prev.map(x => {
          normalizarFijo(x, esMesPasado(py, pm));
          return { id: x.id, name: x.name, tipo: x.tipo, tarifa: x.tarifa || 0, presupuesto: x.presupuesto || 0,
                   quincena: x.quincena || "", dias: "", vence: x.vence || "", metodo: x.metodo || "efectivo", value: 0, fecha: "" };
        })
      : DEFAULT_FIXED.map(f => ({ ...f }));
  }
  const pasado = esMesPasado(y, m);
  data.fijos[key].forEach(x => normalizarFijo(x, pasado));
  return data.fijos[key];
}
// Una sola vez: desde el mes actual en adelante el empleado "por dia" se parte en dos
// quincenas (lo ya pagado llena primero la 1ª) y el arriendo pasa a mes vencido.
// Los meses pasados no se tocan.
function migrarFijos() {
  if (data.migFijos) return;
  const h = new Date();
  fijosDe(h.getFullYear(), h.getMonth());
  Object.keys(data.fijos).forEach(key => {
    const [y, m] = key.split("-").map(Number);
    if (esMesPasado(y, m)) return;
    const lista = data.fijos[key];
    const i = lista.findIndex(x => x.id === "emp" && x.tipo === "diario");
    if (i >= 0) {
      const e = lista[i], pagado = e.value || 0;
      const q1 = { ...e, tipo: "quincena", quincena: 1, dias: "", value: Math.min(pagado, (e.tarifa || 0) * 15) };
      const q2 = { ...e, id: "emp2", tipo: "quincena", quincena: 2, dias: "", value: pagado - q1.value };
      if (!q2.value) q2.fecha = "";
      lista.splice(i, 1, q1, q2);
    }
    lista.forEach(x => { if (x.id === "arriendo" && x.tipo === "mensual") x.tipo = "vencido"; });
  });
  data.migFijos = 1;
}
function fijosDelMes() {
  migrarFijos();
  return fijosDe(currentYear, currentMonth);
}
// texto del estado de un fijo: cuanto falta, cuando vence, cuanto se le debe al empleado
function estadoFijo(item, days, dia) {
  const pres = fijoPresupuesto(item, days), falta = fijoPorPagar(item, days);
  if (pres === 0) return { txt: "Escribe cuánto cuesta para tenerlo en cuenta", color: "#8a9670" };
  if (falta === 0) return { txt: "✓ Pagado completo", color: "#1f5e49" };
  let txt = `Falta ${fmt(falta)}`, color = "#2d3a1e";
  const v = fijoVence(item, days);
  const h = new Date(), esActual = currentYear === h.getFullYear() && currentMonth === h.getMonth();
  if (item.tipo === "diario") {
    const debe = Math.max((item.tarifa || 0) * dia - (item.value || 0), 0);
    if (dia > 0) txt += ` · a hoy le debes ${fmt(debe)} (${dia} días)`;
  } else if (v) {
    if (esMesPasado(currentYear, currentMonth)) { txt += " · quedó sin pagar"; color = "#8b1a1a"; }
    else if (!esActual) txt += ` · vence el día ${v}`;
    else if (v < dia) { txt += ` · venció el día ${v}`; color = "#8b1a1a"; }
    else if (v === dia) { txt += " · vence HOY"; color = "#8b1a1a"; }
    else { txt += ` · vence en ${v - dia} día${v - dia === 1 ? "" : "s"} (día ${v})`; if (v - dia <= 3) color = "#b8860b"; }
  }
  // mes vencido: cuanto hay que apartar cada dia, de hoy hasta que vence (o fin de mes)
  if (item.tipo === "vencido" && esActual && (v || days) >= dia) {
    txt += ` · aparta ≈${fmt(Math.ceil(falta / ((v || days) - dia + 1)))}/día`;
  }
  return { txt, color };
}

  const days = daysInMonth(currentMonth, currentYear), dia = diaCorrido();

  let html = '<div class="section-header"><h3 class="section-title">Gastos Fijos Mensuales</h3>';
  html += '<button class="btn-primary" onclick="addFijo()">+ Agregar Gasto Fijo</button></div>';

      <div>Por pagar<div style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:${faltaTotal > 0 ? '#8b1a1a' : '#1f5e49'}">${fmt(faltaTotal)}</div></div>
    </div>
    <div class="dash-track" style="height:8px;margin-top:10px"><div style="width:${presTotal ? Math.min(pagadoTotal / presTotal * 100, 100) : 0}%;background:${DASH_CAT.fijos.color}"></div></div>
    <div style="font-size:11px;color:#8a9670;margin-top:6px">Solo lo pagado se resta de la caja. Lo que falta lo ves en el Dashboard.</div>
  </div>`;

  const lbl = 'style="font-size:11px;color:#8a9670;white-space:nowrap"';
  f.forEach((item, i) => {
    const pres = fijoPresupuesto(item, days);
    const est = estadoFijo(item, days, dia);
    const falta = fijoPorPagar(item, days);
    const diario = item.tipo === "diario", quincena = item.tipo === "quincena";
    const montoPagar = diario ? Math.max((item.tarifa || 0) * dia - (item.value || 0), 0) : falta;
    const tarifaInput = `<div style="flex:1;min-width:0"><input class="cop-input" value="${fmt(item.tarifa)}" onfocus="this.value='${item.tarifa || ''}';this.select()" onblur="updateFijo(${i},'tarifa',this.value)"></div>`;
    const tipoOpt = (val, txt) => `<option value="${val}" ${(item.tipo || "mensual") === val ? "selected" : ""}>${txt}</option>`;
    html += `<div style="background:#fefdf5;border-radius:10px;border:1px solid #e5ddb5;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <input class="text-input" style="flex:1;min-width:0;font-weight:600" value="${esc(item.name)}" placeholder="Nombre" onchange="updateFijo(${i},'name',this.value)">
        <div style="width:124px;flex-shrink:0"><select class="select-input" onchange="updateFijo(${i},'tipo',this.value)">
          ${tipoOpt("mensual", "Mensual")}${tipoOpt("vencido", "Mes vencido")}${tipoOpt("quincena", "Quincena")}${tipoOpt("diario", "Por día")}
        </select></div>
      </div>
      ${item.tipo === "vencido" ? `<div style="font-size:11px;color:#8a9670;margin:-2px 0 8px">Lo que recoges en ${MONTHS[currentMonth].toLowerCase()} paga el de <b style="color:#2d3a1e">${mesAnterior(currentMonth)}</b></div>` : ""}
      ${quincena ? `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <div style="flex:1;min-width:0"><select class="select-input" onchange="updateFijo(${i},'quincena',this.value)">
          <option value="1" ${item.quincena !== 2 ? "selected" : ""}>1ª quincena · día 1 al 15</option>
          <option value="2" ${item.quincena === 2 ? "selected" : ""}>2ª quincena · día 16 al ${days}</option>
        </select></div>
        <span ${lbl}>Días</span>
        <div style="width:52px;flex-shrink:0"><input class="cop-input" style="text-align:center" value="${fijoDias(item, days)}" onfocus="this.select()" onchange="updateFijo(${i},'dias',this.value)"></div>
      </div>` : ""}
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        ${diario || quincena
          ? `<span ${lbl}>Por día</span>${tarifaInput}
             <span ${lbl}>× ${diario ? days : fijoDias(item, days)} días = <b style="color:#2d3a1e">${fmt(pres)}</b></span>`
          : `<span ${lbl}>Cuesta</span>
             <div style="flex:1;min-width:0"><input class="cop-input" value="${fmt(item.presupuesto)}" onfocus="this.value='${item.presupuesto || ''}';this.select()" onblur="updateFijo(${i},'presupuesto',this.value)"></div>
             <span ${lbl}>Vence día</span>
             <div style="width:52px;flex-shrink:0"><input class="cop-input" style="text-align:center" value="${item.vence || ''}" placeholder="—" onchange="updateFijo(${i},'vence',this.value)"></div>`}
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <span ${lbl}>Pagado</span>
        <div style="flex:1;min-width:0"><input class="cop-input" value="${fmt(item.value)}" onfocus="this.value='${item.value || ''}';this.select()" onblur="updateFijo(${i},'value',this.value)"></div>
        <button class="btn-delete" onclick="removeFijo(${i})">✕</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="flex:1;min-width:0"><input type="date" class="text-input" value="${item.fecha||''}" onchange="updateFijo(${i},'fecha',this.value)"></div>
        <div style="flex:1;min-width:0"><select class="select-input" onchange="updateFijo(${i},'metodo',this.value)">
          <option value="efectivo" ${(item.metodo||'efectivo')!="bancolombia"?"selected":""}>Efectivo</option>
          <option value="bancolombia" ${item.metodo=="bancolombia"?"selected":""}>Bancolombia</option>
        </select></div>
      </div>
      <div class="dash-track" style="margin-top:10px"><div style="width:${pres ? Math.min((item.value || 0) / pres * 100, 100) : 0}%;background:${DASH_CAT.fijos.color}"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:600;color:${est.color}">${est.txt}</span>
        ${montoPagar > 0 ? `<button class="dash-link" style="margin:0" onclick="pagarFijo(${i})">${diario ? `Registrar pago de ${fmt(montoPagar)}` : quincena ? `Pagar quincena (${fmt(montoPagar)})` : "Marcar pagado"}</button>` : ""}
      </div>
    </div>`;
  });

  const totEfF = f.reduce((s, x) => s + ((x.metodo||'efectivo') !== "bancolombia" ? (x.value || 0) : 0), 0);
  const totBaF = f.reduce((s, x) => s + (x.metodo === "bancolombia" ? (x.value || 0) : 0), 0);
  const total = totEfF + totBaF;
  html += `<div style="display:flex;flex-direction:column;gap:6px;margin-top:16px">
    <div style="background:#3a6b28;border-radius:10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#c8e6b0">Efectivo</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#e8f5e0;margin-top:4px;white-space:nowrap">${fmt(totEfF)}</div>
    </div>
    <div style="background:#154360;border-radius:10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#aed6f1">Bancolombia</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#d6eaf8;margin-top:4px;white-space:nowrap">${fmt(totBaF)}</div>
    </div>
  </div>`;
  html += `<div class="total-bar" style="background:#5c1a6e;color:#f0d9f7">
    <span class="tl">Total Pagado</span><span class="tv">${fmt(total)}</span>
  </div>`;

  document.getElementById("tab-fijos").innerHTML = html;
}

function addFijo() {
  const key = getKey();
  fijosDelMes();
  const nuevo = { id: "c_" + Date.now(), name: "Nuevo gasto", value: 0, fecha: "", metodo: "efectivo", tipo: "mensual", presupuesto: 0, tarifa: 0, vence: "" };
  data.fijos[key].push(nuevo);
  saveData(); renderFijos();
  focusFila("tab-fijos", data.fijos[key].indexOf(nuevo), 'input[placeholder="Nombre"]');
}
function updateFijo(i, field, val) {
  const key = getKey();
  if (["value", "presupuesto", "tarifa"].includes(field)) val = parseInt(val.replace(/[^0-9-]/g,"")) || 0;
  if (field === "vence") { const d = parseInt(val); val = d >= 1 && d <= 31 ? d : ""; }
  if (field === "dias") { const d = parseInt(val); val = d >= 0 && d <= 31 ? d : ""; }
  if (field === "quincena") { val = parseInt(val) === 2 ? 2 : 1; data.fijos[key][i].dias = ""; }
  if (field === "tipo" && val === "quincena" && !data.fijos[key][i].quincena) data.fijos[key][i].quincena = 1;
  data.fijos[key][i][field] = val;
  saveData(); renderFijos();
}
// registra como pagado lo que falta (o, si es por dia, lo causado hasta hoy)
function pagarFijo(i) {
  const key = getKey(), item = data.fijos[key][i];
  const days = daysInMonth(currentMonth, currentYear);
  item.value = item.tipo === "diario"
    ? Math.min((item.tarifa || 0) * diaCorrido(), fijoPresupuesto(item, days))
    : fijoPresupuesto(item, days);
  item.fecha = todayLocal();
  saveData(); renderFijos();
}
function removeFijo(i) {
  const key = getKey();
  data.fijos[key].splice(i, 1);
  saveData(); renderFijos();
}

// ============ CAJA ============
function calcBalanceCaja(key) {
  const days = daysInMonth(currentMonth, currentYear);
  const v = data.ventas?.[key] || {};
  const g = data.gastos?.[key] || [];
  const m = data.mercancia?.[key] || [];
  const f = data.fijos?.[key] || DEFAULT_FIXED;

  let ventasEf = 0, ventasBa = 0;
  for (let d = 1; d <= days; d++) {
    ventasEf += (v[d]?.efectivo || 0);
    ventasBa += (v[d]?.bancolombia || 0);
  }
  const adicionales = data.adicionales?.[key] || [];
  ventasEf += adicionales.reduce((s, x) => s + (x.efectivo || 0), 0);
  ventasBa += adicionales.reduce((s, x) => s + (x.bancolombia || 0), 0);

  const gastosEf = g.reduce((s, x) => s + ((x.metodo||'efectivo') !== 'bancolombia' ? (x.valor||0) : 0), 0);
  const gastosBa = g.reduce((s, x) => s + (x.metodo === 'bancolombia' ? (x.valor||0) : 0), 0);
  const mercEf   = m.reduce((s, x) => s + ((x.metodo||'efectivo') !== 'bancolombia' ? (x.costo||0) : 0), 0);
  const mercBa   = m.reduce((s, x) => s + (x.metodo === 'bancolombia' ? (x.costo||0) : 0), 0);
  const fijosEf  = f.reduce((s, x) => s + ((x.metodo||'efectivo') !== 'bancolombia' ? (x.value||0) : 0), 0);
  const fijosBa  = f.reduce((s, x) => s + (x.metodo === 'bancolombia' ? (x.value||0) : 0), 0);

  const egresosEf = gastosEf + mercEf + fijosEf;
  const egresosBa = gastosBa + mercBa + fijosBa;
  const traslados = data.traslados?.[key] || [];
  const totalTraslado = traslados.reduce((s, t) => s + (t.monto || 0), 0);
  const saldoEf = ventasEf - egresosEf - totalTraslado;
  const saldoBa = ventasBa - egresosBa + totalTraslado;

  return { ventasEf, ventasBa, gastosEf, gastosBa, mercEf, mercBa, fijosEf, fijosBa,
           egresosEf, egresosBa, traslados, totalTraslado, saldoEf, saldoBa };
}

function renderCaja() {
  const key = getKey();
  const { ventasEf, ventasBa, gastosEf, gastosBa, mercEf, mercBa, fijosEf, fijosBa,
          egresosEf, egresosBa, traslados, totalTraslado, saldoEf, saldoBa } = calcBalanceCaja(key);

  const fmtSaldo = n => n < 0 ? `-${fmt(Math.abs(n))}` : fmt(n);

  const lineRow = (label, val) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f0ead0">
    <span style="font-size:13px;color:${val > 0 ? '#4a5568' : '#aab89a'}">${label}</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:${val > 0 ? '#8b1a1a' : '#ccc'}">${val > 0 ? '-' + fmt(val) : '—'}</span>
  </div>`;

  const cajaCard = (titulo, bgHeader, colorTxt, ventas, gastos, merc, fijos, egresos, saldo) => {
    const saldoColor = saldo >= 0 ? '#2d5016' : '#8b1a1a';
    const saldoBg    = saldo >= 0 ? '#e8f2dc' : '#fce4e4';
    return `<div style="border-radius:14px;overflow:hidden;border:2px solid ${bgHeader}66">
      <div style="background:${bgHeader};padding:16px 20px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:${colorTxt};opacity:.8">${titulo}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:${colorTxt};margin-top:4px">${fmt(ventas)}</div>
        <div style="font-size:11px;color:${colorTxt};opacity:.65;margin-top:2px">ingresos del mes</div>
      </div>
      <div style="background:#fefdf5;padding:14px 18px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#6b7c5e;margin-bottom:8px">Egresos</div>
        ${lineRow('Gastos variables', gastos)}
        ${lineRow('Mercancía', merc)}
        ${lineRow('Gastos fijos', fijos)}
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px">
          <span style="font-size:12px;font-weight:700;color:#6b1a1a;text-transform:uppercase;letter-spacing:1px">Total egresos</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#8b1a1a">${egresos > 0 ? '-' + fmt(egresos) : '—'}</span>
        </div>
        <div style="border-radius:10px;padding:14px 16px;background:${saldoBg};display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:${saldoColor}">Saldo estimado</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:${saldoColor}">${fmtSaldo(saldo)}</span>
        </div>
      </div>
    </div>`;
  };

  let html = `<h3 class="section-title">Balance de Caja — ${MONTHS[currentMonth]} ${currentYear}</h3>`;
  html += '<div class="caja-grid">';
  html += cajaCard('Efectivo', '#3a6b28', '#e8f5e0', ventasEf, gastosEf, mercEf, fijosEf, egresosEf, saldoEf);
  html += cajaCard('Bancolombia', '#154360', '#d6eaf8', ventasBa, gastosBa, mercBa, fijosBa, egresosBa, saldoBa);
  html += '</div>';

  // Traslados section
  let trasladosRows = '';
  if (traslados.length === 0) {
    trasladosRows = `<div style="text-align:center;color:#c9a22280;font-size:13px;padding:10px 0">Sin traslados este mes</div>`;
  } else {
    traslados.forEach(t => {
      const esReverso = t.monto < 0;
      const flecha = esReverso ? '← Ba → Ef' : '→ Ef → Ba';
      const colorFlecha = esReverso ? '#154360' : '#3a6b28';
      const montoAbs = fmt(Math.abs(t.monto));
      trasladosRows += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5e6b0">
        <div>
          <span style="font-size:11px;font-weight:700;color:${colorFlecha};margin-right:6px">${flecha}</span>
          <span style="font-size:12px;color:#8b6914">${t.fecha}</span>
          ${t.descripcion ? `<span style="font-size:12px;color:#a0845c;margin-left:6px">${t.descripcion}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:${colorFlecha}">${montoAbs}</span>
          <button onclick="deleteTraslado(${t.id})" style="background:none;border:none;color:#c0392b;font-size:16px;cursor:pointer;padding:0;line-height:1">✕</button>
        </div>
      </div>`;
    });
    trasladosRows += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0 0">
      <span style="font-size:12px;font-weight:700;color:#8b6914;text-transform:uppercase;letter-spacing:1px">Neto trasladado a Bancolombia</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:#8b6914">${fmt(totalTraslado)}</span>

function confirmTraslado() {
  const key = getKey();
  const monto = parseFloat(document.getElementById('traslado-monto')?.value) || 0;
  if (monto <= 0) { alert('Ingresa un monto válido'); return; }
  const dir = document.getElementById('traslado-dir')?.value || trasladoFormDir;
  const desc = document.getElementById('traslado-desc')?.value || '';
  const montoFinal = dir === 'ba_ef' ? -monto : monto;

  trasladoFormDir = dir;
  trasladoFormOpen = true;
  renderCaja();
  setTimeout(() => { document.getElementById('traslado-monto')?.focus(); }, 50);

function deleteTraslado(id) {
  const key = getKey();
  if (!data.traslados?.[key]) return;
  data.traslados[key] = data.traslados[key].filter(t => t.id !== id);
  saveData();
  renderCaja();
}

// ============ ARQUEO DE CAJA ============
const DENOMINACIONES = [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100, 50];
let arqueoCantidades = Object.fromEntries(DENOMINACIONES.map(d => [d, 0]));

function resetArqueoCantidades() {
  DENOMINACIONES.forEach(d => arqueoCantidades[d] = 0);
}

function arqueoTotal() {
  return DENOMINACIONES.reduce((s, den) => s + den * (arqueoCantidades[den] || 0), 0);
}

function arqueoVeredicto(dif) {
  if (dif === 0) return { txt: "✓ Caja empatada", color: "#2d5016", bg: "#e8f2dc" };
  if (dif < 0)  return { txt: "Falta " + fmt(-dif), color: "#8b1a1a", bg: "#fce4e4" };
  return { txt: "Sobra " + fmt(dif), color: "#8b6914", bg: "#fff8e6" };
}

function nowBogota() {
  const d = new Date();
  const fecha = d.toLocaleDateString("en-CA", { timeZone: "America/Bogota" });
  const hora = d.toLocaleTimeString("es-CO", { timeZone: "America/Bogota", hour: "2-digit", minute: "2-digit", hour12: true });
  return { fecha, hora };
}

function updateArqueoCantidad(den, val) {
  let n = parseInt(val, 10);
  if (!Number.isFinite(n) || n < 0) n = 0;
  arqueoCantidades[den] = n;
  const sub = den * n;
  const subEl = document.getElementById("arq-sub-" + den);
  if (subEl) {
    subEl.textContent = sub > 0 ? fmt(sub) : "—";
    subEl.style.color = sub > 0 ? "#2d5016" : "#ccc";
  }
  const total = arqueoTotal();
  const totEl = document.getElementById("arq-total");
  if (totEl) totEl.textContent = fmt(total);
  const { saldoEf } = calcBalanceCaja(getKey());
  const ver = arqueoVeredicto(total - saldoEf);
  const verEl = document.getElementById("arq-verdict");
  if (verEl) {
    verEl.textContent = ver.txt;
    verEl.style.color = ver.color;
    verEl.style.background = ver.bg;
  }
}

function guardarArqueo() {
  const key = getKey();
  const total = arqueoTotal();
  const { saldoEf } = calcBalanceCaja(key);
  const { fecha, hora } = nowBogota();
  if (!data.arqueos) data.arqueos = {};
  if (!data.arqueos[key]) data.arqueos[key] = [];
  data.arqueos[key].push({
    id: Date.now(),
    fecha, hora,
    cantidades: { ...arqueoCantidades },
    totalContado: total,
    saldoEstimado: saldoEf,
    diferencia: total - saldoEf
  });
  saveData();
  resetArqueoCantidades();
  renderCaja();
}

function limpiarArqueo() {
  resetArqueoCantidades();
  renderCaja();
}

function deleteArqueo(id) {
  const key = getKey();
  if (!data.arqueos?.[key]) return;
  data.arqueos[key] = data.arqueos[key].filter(a => a.id !== id);
  saveData();
  renderCaja();
}

// colores validados para daltonismo en este orden (gastos, fijos, mercancia, utilidad)
const DASH_CAT = {
  gastos:    { label: "Gastos",       color: "#c0392b" },
  fijos:     { label: "Gastos Fijos", color: "#8e44ad" },
  mercancia: { label: "Mercancía",    color: "#c27c14" },
  utilidad:  { label: "Utilidad",     color: "#2a8a6a" },
};
let dashChart = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function fmtShort(n) {
  const a = Math.abs(n), s = n < 0 ? "-$" : "$";
  if (a >= 1e6) return s + (a / 1e6).toLocaleString("es-CO", { maximumFractionDigits: 1 }) + "M";
  if (a >= 1e3) return s + Math.round(a / 1e3).toLocaleString("es-CO") + "k";
  return s + a;
}
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
// dia del mes visible al que pertenece una fecha; sin fecha o fuera del mes -> dia 1
function diaDelMes(fecha, days) {
  if (typeof fecha === "number") return Math.min(Math.max(fecha, 1), days);
  const p = String(fecha || "").split("-");
  if (p.length === 3 && +p[0] === currentYear && +p[1] === currentMonth + 1) return Math.min(Math.max(parseInt(p[2]) || 1, 1), days);
  return 1;
}
// Familias para agrupar compras en el dashboard. El orden define como se nombra una
// compra combinada ("Pan y papas" -> "Pan + Papas"). Los patrones van sobre texto
// en minusculas y sin tildes.
const FAMILIAS = [
  ["Salchichas", /salchich/],
  ["Pan", /\bpan\b|\bperros?\b/],
  ["Papas", /\bpapas?\b|ripio/],
  ["Queso", /queso/],
  ["Tocineta", /tocineta/],
  ["Huevos", /huevo/],
  ["Piña", /\bpina\b/],
  ["Salsas", /salsa|mayones|matones|chipot|bbq|rosada|showy|vermelo|bary|mostaza|guacamole|dooypa|\bwao\b|soya|cheddar|\baji\b/],
  ["Pepinillos y jalapeños", /pepinill|jalapen|nachote/],
  ["Verduras", /tomate|cebolla|pimenton|repollo|cilantro|zanahoria|limon|\bajo\b/],
  ["Gaseosas", /gase?s?osa|coca|bretana/],
  ["Aceite", /aceite/],
  ["Azúcar y panela", /azucar|panela/],
  ["Empaques", /caja|carton|bolsa|servillet|palil|aluminio|vaso|copas|tapas|polietileno|\bporta\b/],
  ["Aseo", /jabon|esponja|escoba|trapero|recogedor|lavaplatos|toalla|papel|guantes|\baseo\b/],
  ["Parqueadero", /parque/],
  ["Arriendo", /arriendo/],
];
// quita cantidades: "x8", "x 4", "3 und", "7oz", "1 kg"
const RE_CANTIDAD = /\bx\s*\d+\b|\b\d+\s*x\b|\b\d+\s*(und|unidades|kg|gr?|oz|lb|lt?)?\b/gi;
function sinTildes(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
// en gastos y fijos solo se unifican parqueadero y arriendo; el resto de familias es de mercancia
function familiaDe(nombre, cat) {
  let t = sinTildes(String(nombre || "").toLowerCase()).replace(/[^a-z0-9ñ ]/g, " ");
  // casos donde una palabra de salsa o de pan no lo es
  t = t.replace(/queso cheddar/g, "queso").replace(/aceite (de )?soya/g, "aceite")
       .replace(/salsa de tomate|tomate bary/g, "salsa").replace(/(cajas?|carton|bolsas?) (para )?perros?/g, "caja");
  const fams = FAMILIAS.filter(([label, re]) => (cat === "mercancia" || label === "Parqueadero" || label === "Arriendo") && re.test(t)).map(([label]) => label);
  if (fams.length === 1) return { key: fams[0], label: fams[0] };
  if (fams.length === 2 || fams.length === 3) { const l = fams.join(" + "); return { key: l, label: l }; }
  if (fams.length > 3) return { key: "_mixtas", label: "Compras mixtas" };
  // sin familia: nombre limpio; singular/plural y mayusculas cuentan igual
  const limpio = String(nombre || "").replace(RE_CANTIDAD, " ").replace(/\s+/g, " ").replace(/^[\s,.\-]+|[\s,.\-]+$/g, "");
  if (!limpio) return { key: "_sin", label: "Sin nombre" };
  const key = sinTildes(limpio.toLowerCase()).split(" ").map(w => w.replace(/(es|s)$/, "")).join(" ");
  return { key, label: limpio.charAt(0).toUpperCase() + limpio.slice(1) };
}

function renderDashboard() {
  const key = getKey();
  const days = daysInMonth(currentMonth, currentYear);
  const v = data.ventas?.[key] || {};
  const adic = data.adicionales?.[key] || [];
  const g = data.gastos?.[key] || [];
  const m = data.mercancia?.[key] || [];
  const f = fijosDelMes();

  // series por dia
  const ventasDia = Array(days + 1).fill(0);
  const egresosDia = Array(days + 1).fill(0);
  for (let d = 1; d <= days; d++) ventasDia[d] = (v[d]?.efectivo || 0) + (v[d]?.bancolombia || 0);
  adic.forEach(a => ventasDia[diaDelMes(a.fecha, days)] += (a.efectivo || 0) + (a.bancolombia || 0));
  g.forEach(x => egresosDia[diaDelMes(x.fecha, days)] += (x.valor || 0));
  m.forEach(x => egresosDia[diaDelMes(x.fecha, days)] += (x.costo || 0));
  f.forEach(x => egresosDia[diaDelMes(x.fecha, days)] += (x.value || 0));

  const tot = {
    gastos: g.reduce((s, x) => s + (x.valor || 0), 0),
    fijos: f.reduce((s, x) => s + (x.value || 0), 0),
    mercancia: m.reduce((s, x) => s + (x.costo || 0), 0),
  };
  const totVentas = ventasDia.reduce((s, x) => s + x, 0);
  const totEgresos = tot.gastos + tot.fijos + tot.mercancia;
  const utilidad = totVentas - totEgresos;

  // en que punto del mes estamos
  const hoy = new Date();
  const mesIdx = currentYear * 12 + currentMonth, hoyIdx = hoy.getFullYear() * 12 + hoy.getMonth();
  const esMesActual = mesIdx === hoyIdx;
  const diaActual = mesIdx < hoyIdx ? days : mesIdx > hoyIdx ? 0 : hoy.getDate();
  const diasConVenta = ventasDia.filter(x => x > 0).length;
  const promedioDia = diaActual > 0 ? totVentas / diaActual : 0;
  const proyeccion = esMesActual ? Math.round(promedioDia * days) : totVentas;

  let html = `<h3 class="section-title">Dashboard — ${MONTHS[currentMonth]} ${currentYear}</h3>`;

  // ---- KPIs
  const progresoTxt = esMesActual ? `Día ${diaActual} de ${days}` : mesIdx < hoyIdx ? "Mes cerrado" : "Aún no empieza";
  html += '<div class="dash-kpis">';
  html += `<div class="dash-kpi"><div class="k-label">Ventas</div><div class="k-val">${fmt(totVentas)}</div><div class="k-sub">${diasConVenta} días con venta</div></div>`;
  html += `<div class="dash-kpi"><div class="k-label">Egresos</div><div class="k-val">${fmt(totEgresos)}</div><div class="k-sub">${pct(totEgresos, totVentas)}% de las ventas</div></div>`;
  html += `<div class="dash-kpi" style="${utilidad < 0 ? 'background:#fce8e8;border-color:#e8b8b8' : ''}"><div class="k-label">${utilidad >= 0 ? "Utilidad" : "Pérdida"}</div><div class="k-val" style="color:${utilidad >= 0 ? '#1f5e49' : '#8b1a1a'}">${fmt(utilidad)}</div><div class="k-sub">Margen ${totVentas > 0 ? pct(utilidad, totVentas) + "%" : "—"}</div></div>`;
  html += `<div class="dash-kpi"><div class="k-label">${progresoTxt}</div>
    <div class="dash-progress"><div style="width:${days ? diaActual / days * 100 : 0}%"></div></div>
    <div class="k-sub">Promedio ${fmt(Math.round(promedioDia))}/día${esMesActual && totVentas > 0 ? `<br>A este ritmo: <b style="color:#2d3a1e">${fmt(proyeccion)}</b>` : ""}</div></div>`;
  html += '</div>';

  // ---- Me alcanza para los fijos?
  // "Llevas" = ventas menos todo lo ya pagado. Esa plata se reparte entre los fijos
  // pendientes en orden de vencimiento para ver cuales ya estan cubiertos.
  const presFijos = f.reduce((s, x) => s + fijoPresupuesto(x, days), 0);
  if (presFijos > 0) {
    const pend = f.map(x => ({ x, falta: fijoPorPagar(x, days), vence: fijoVence(x, days) || 99 }))
      .filter(p => p.falta > 0).sort((a, b) => a.vence - b.vence);
    const porPagar = pend.reduce((s, p) => s + p.falta, 0);
    let disp = Math.max(utilidad, 0);
    pend.forEach(p => { p.cubierto = Math.min(disp, p.falta); disp -= p.cubierto; });
    const cubierto = pend.reduce((s, p) => s + p.cubierto, 0);
    const faltaCubrir = porPagar - cubierto;
    const libre = utilidad - porPagar;
    const pagadoF = presFijos - porPagar;
    const gananciaDia = diaActual > 0 ? (totVentas - tot.mercancia - tot.gastos) / diaActual : 0;
    const diasRestantes = days - diaActual;

    html += `<div class="dash-card"><div class="dash-card-title">¿Me alcanza para los gastos fijos? <small>cuestan ${fmt(presFijos)} este mes</small></div>`;
    html += `<div class="dash-trio">
      <div><div class="t-label">Llevas</div><div class="t-val">${fmt(utilidad)}</div><div class="t-sub">ventas − lo ya pagado</div></div>
      <div><div class="t-label">Fijos por pagar</div><div class="t-val">${fmt(porPagar)}</div><div class="t-sub">${pend.length} pendiente${pend.length === 1 ? "" : "s"}</div></div>
      <div><div class="t-label">Libre de verdad</div><div class="t-val" style="color:${libre >= 0 ? '#1f5e49' : '#8b1a1a'}">${fmt(libre)}</div><div class="t-sub">llevas − por pagar</div></div>
    </div>`;

    // barra: pagado | ya tienes la plata | falta conseguir
    html += '<div class="dash-stack" style="height:22px">';
    [[pagadoF, DASH_CAT.fijos.color, "Pagado"], [cubierto, DASH_CAT.utilidad.color, "Ya tienes la plata"]].forEach(([val, col, t]) => {
      if (val > 0) html += `<div class="seg" style="flex:${val} 0 0;background:${col}" title="${t}: ${fmt(val)}"></div>`;
    });
    if (faltaCubrir > 0) html += `<div class="seg" style="flex:${faltaCubrir} 0 0;background:repeating-linear-gradient(135deg,#efe8c8 0 6px,#e5ddb5 6px 12px)" title="Falta conseguir: ${fmt(faltaCubrir)}"></div>`;
    html += '</div><div class="dash-legend" style="grid-template-columns:repeat(3,auto);justify-content:start;gap:6px 18px">';
    [[DASH_CAT.fijos.color, "Pagado", pagadoF], [DASH_CAT.utilidad.color, "Ya tienes la plata", cubierto],
     ["repeating-linear-gradient(135deg,#efe8c8 0 3px,#c9bf8a 3px 6px)", "Falta conseguir", faltaCubrir]].forEach(([bg, t, val]) => {
      html += `<div class="lg"><div class="dash-sw" style="background:${bg}"></div><div><div class="lg-name">${t}</div><div class="lg-val">${fmt(val)}</div></div></div>`;
    });
    html += '</div>';

    let msg, msgBg = "#e8f2dc", msgCol = "#1f5e49";
    if (porPagar === 0) msg = "✓ Todos los gastos fijos del mes están pagados.";
    else if (faltaCubrir === 0) msg = `✓ Con lo que llevas ya cubres todos los fijos que faltan y te sobran ${fmt(libre)}.`;
    else {
      msgBg = "#fdf1dc"; msgCol = "#7a4f0e";
      msg = `Te faltan <b>${fmt(faltaCubrir)}</b> para cubrir los fijos.`;
      if (esMesActual && diasRestantes > 0) {
        if (gananciaDia > 0) {
          const n = Math.ceil(faltaCubrir / gananciaDia);
          msg += ` A tu ritmo (≈${fmt(Math.round(gananciaDia))} de ganancia por día, después de mercancía y gastos) los cubres en <b>${n} día${n === 1 ? "" : "s"}</b>`;
          msg += n <= diasRestantes ? ", antes de que termine el mes." : `, pero solo quedan ${diasRestantes} días: necesitas ganar ≈${fmt(Math.ceil(faltaCubrir / diasRestantes))} por día.`;
        } else {
          msg += " Con el ritmo actual las ventas apenas cubren la mercancía y los gastos.";
        }
      }
    }
    html += `<div style="font-size:13px;line-height:1.5;color:${msgCol};background:${msgBg};border-radius:8px;padding:10px 12px;margin-top:12px">${msg}</div>`;

    if (pend.length) {
      html += '<div class="dash-items" style="margin-top:12px">';
      pend.forEach(p => {
        const est = estadoFijo(p.x, days, diaActual);
        const chip = p.cubierto >= p.falta
          ? `<span style="color:#1f5e49">✓ cubierto</span>`
          : p.cubierto > 0 ? `<span style="color:#7a4f0e">faltan ${fmt(p.falta - p.cubierto)}</span>` : `<span style="color:#8b1a1a">faltan ${fmt(p.falta)}</span>`;
        html += `<div class="dash-item" style="margin-bottom:9px"><div class="dash-item-row"><span class="n" style="font-weight:700">${esc(fijoNombre(p.x))}</span><span class="v">${chip}</span></div>
          <div style="font-size:11px;color:${est.color === '#2d3a1e' ? '#8a9670' : est.color}">${est.txt}</div></div>`;
      });
      html += `</div><button class="dash-link" onclick="irATab('fijos')">Ir a gastos fijos →</button>`;
    }
    html += '</div>';
  }

  // ---- A donde se va la plata
  const base = Math.max(totVentas, totEgresos);
  html += `<div class="dash-card"><div class="dash-card-title">¿A dónde se va la plata? <small>de cada $100 vendidos</small></div>`;
  if (base === 0) {
    html += '<div class="empty-state" style="padding:24px">Todavía no hay ventas ni gastos este mes</div>';
  } else {
    const segs = ["gastos", "fijos", "mercancia"].map(k => ({ k, val: tot[k] }));
    if (utilidad > 0) segs.push({ k: "utilidad", val: utilidad });
    html += '<div class="dash-stack-wrap" style="margin-top:18px"><div class="dash-stack">';
    segs.filter(s => s.val > 0).forEach(s => {
      html += `<div class="seg" style="flex:${s.val} 0 0;background:${DASH_CAT[s.k].color}" title="${DASH_CAT[s.k].label}: ${fmt(s.val)} (${pct(s.val, totVentas)}% de ventas)"></div>`;
    });
    html += '</div>';
    if (totEgresos > totVentas && totVentas > 0) {
      html += `<div class="dash-mark" style="left:${totVentas / base * 100}%"><span>Ventas</span></div>`;
    }
    html += '</div><div class="dash-legend">';
    segs.forEach(s => {
      html += `<div class="lg"><div class="dash-sw" style="background:${DASH_CAT[s.k].color}"></div><div>
        <div class="lg-name">${DASH_CAT[s.k].label}</div>
        <div class="lg-val">${fmt(s.val)}</div>
        <div class="lg-pct">${totVentas > 0 ? `$${pct(s.val, totVentas)} de cada $100` : "—"}</div></div></div>`;
    });
    html += '</div>';
    if (totEgresos > totVentas) {
      html += `<div class="dash-alert">⚠ Los egresos superan las ventas en ${fmt(totEgresos - totVentas)}</div>`;
    }
  }
  html += '</div>';

  // ---- Categorias
  const cats = [
    { k: "mercancia", tab: "mercancia", items: m.map(x => ({ n: x.producto || "Sin nombre", v: x.costo || 0 })) },
    { k: "fijos", tab: "fijos", items: f.map(x => ({ n: x.name || "Sin nombre", v: x.value || 0 })) },
    { k: "gastos", tab: "gastos", items: g.map(x => ({ n: x.descripcion || "Sin descripción", v: x.valor || 0 })) },
  ];
  html += '<div class="dash-cats">';
  cats.forEach(c => {
    const cfg = DASH_CAT[c.k], total = tot[c.k];
    // agrupa por familia ("Salchichas x8" y "salchicha" suman juntas)
    const grupos = {};
    c.items.forEach(it => {
      const fam = familiaDe(it.n, c.k);
      const gr = grupos[fam.key] || (grupos[fam.key] = { label: fam.label, v: 0, n: 0, nombres: new Set() });
      gr.v += it.v; gr.n++; gr.nombres.add(it.n.trim());
    });
    const top = Object.values(grupos).filter(gr => gr.v > 0).sort((a, b) => b.v - a.v).map(gr => {
      const tip = gr.n > 1 ? `${gr.n} registros: ${[...gr.nombres].slice(0, 8).join(", ")}${gr.nombres.size > 8 ? "…" : ""}` : gr.label;
      return [gr.n > 1 ? `${esc(gr.label)} <span style="color:#8a9670">×${gr.n}</span>` : esc(gr.label), gr.v, tip, gr.label];
    });
    const maxItem = top.length ? top[0][1] : 0;
    let sub = `${pct(total, totEgresos)}% de los egresos · ${pct(total, totVentas)}% de las ventas`;
    if (c.k === "fijos") sub += `<br>Pagado ${fmt(total)} de ${fmt(presFijos)}`;
    html += `<div class="dash-cat">
      <div class="dash-cat-head"><div class="dash-sw" style="background:${cfg.color};margin:0"></div>${cfg.label}</div>
      <div class="dash-cat-val">${fmt(total)}</div>
      <div class="dash-track"><div style="width:${pct(total, totEgresos)}%;background:${cfg.color}"></div></div>
      <div class="dash-cat-pct">${sub}</div>
      <div class="dash-items">`;
    if (top.length === 0) {
      html += '<div style="font-size:12px;color:#8a9670">Sin registros este mes</div>';
    } else {
      top.slice(0, 5).forEach(([n, val, tip]) => {
        html += `<div class="dash-item"><div class="dash-item-row"><span class="n" title="${esc(tip)}">${n}</span><span class="v">${fmt(val)}</span></div>
          <div class="dash-track"><div style="width:${val / maxItem * 100}%;background:${cfg.color}"></div></div></div>`;
      });
      if (top.length > 5) {
        const resto = top.slice(5).reduce((s, [, val]) => s + val, 0);
        html += `<div class="dash-item-row" style="color:#8a9670"><span>+${top.length - 5} más</span><span class="v">${fmt(resto)}</span></div>`;
      }
    }
    html += `</div><button class="dash-link" onclick="irATab('${c.tab}')">Ver detalle →</button></div>`;
  });
  html += '</div>';

  // ---- Como va el mes (acumulado)
  html += `<div class="dash-card"><div class="dash-card-title">¿Cómo va el mes? <small>ventas y egresos acumulados día a día</small></div>`;
  if (diaActual === 0 || base === 0) {
    html += '<div class="empty-state" style="padding:24px">Sin datos para graficar todavía</div></div>';
    document.getElementById("tab-dashboard").innerHTML = html;
    dashChart = null;
    return;
  }
  html += `<div class="dash-chart-legend">
    <span><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="${DASH_CAT.utilidad.color}" stroke-width="2.5"/></svg>Ventas</span>
    <span><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="${DASH_CAT.gastos.color}" stroke-width="2.5" stroke-dasharray="5 3"/></svg>Egresos</span>
  </div><div class="dash-chart" id="dash-chart"></div></div>`;
  document.getElementById("tab-dashboard").innerHTML = html;

  const acV = [0], acE = [0];
  for (let d = 1; d <= days; d++) { acV[d] = acV[d - 1] + ventasDia[d]; acE[d] = acE[d - 1] + egresosDia[d]; }
  dashChart = { days, last: diaActual, acV, acE, ventasDia, egresosDia, esMesActual };
  drawDashChart();
}

function drawDashChart() {
  const host = document.getElementById("dash-chart");
  if (!host || !dashChart) return;
  const { days, last, acV, acE, esMesActual } = dashChart;
  const W = Math.max(host.clientWidth, 280), H = 240;
  const ml = 46, mr = 62, mt = 12, mb = 24;
  const pw = W - ml - mr, ph = H - mt - mb;
  const rawMax = Math.max(acV[last], acE[last], 1);
  const mag = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => rawMax / s <= 4) || mag * 10;
  const yMax = Math.ceil(rawMax / step) * step;
  const x = d => ml + (days > 1 ? (d - 1) / (days - 1) : 0) * pw;
  const y = val => mt + (1 - val / yMax) * ph;
  Object.assign(dashChart, { W, ml, pw, x, y });

  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Ventas y egresos acumulados del mes">`;
  for (let t = 0; t <= yMax + 1; t += step) {
    s += `<line x1="${ml}" x2="${ml + pw}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? '#c9bf8a' : '#efe8c8'}" stroke-width="1"/>`;
    s += `<text x="${ml - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="#8a9670" font-family="JetBrains Mono, monospace">${fmtShort(t)}</text>`;
  }
  [1, 5, 10, 15, 20, 25, days].filter((d, i, a) => d <= days && a.indexOf(d) === i && !(d !== days && days - d < 3)).forEach(d => {
    s += `<text x="${x(d)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#8a9670">${d}</text>`;
  });
  if (esMesActual && last < days) {
    s += `<line x1="${x(last)}" x2="${x(last)}" y1="${mt}" y2="${mt + ph}" stroke="#c9a222" stroke-width="1" stroke-dasharray="3 3"/>`;
    s += `<text x="${x(last)}" y="${mt - 2}" text-anchor="middle" font-size="10" font-weight="700" fill="#8b6914">Hoy</text>`;
  }
  const path = arr => { let p = ""; for (let d = 1; d <= last; d++) p += (d === 1 ? "M" : "L") + x(d).toFixed(1) + "," + y(arr[d]).toFixed(1); return p; };
  s += `<path d="${path(acE)}" fill="none" stroke="${DASH_CAT.gastos.color}" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>`;
  s += `<path d="${path(acV)}" fill="none" stroke="${DASH_CAT.utilidad.color}" stroke-width="2" stroke-linejoin="round"/>`;

  // etiquetas al final de cada linea, separadas si se pisan
  let yv = y(acV[last]), ye = y(acE[last]);
  if (Math.abs(yv - ye) < 14) { const mid = (yv + ye) / 2, up = acV[last] >= acE[last]; yv = mid + (up ? -7 : 7); ye = mid + (up ? 7 : -7); }
  [[acE, DASH_CAT.gastos.color, ye], [acV, DASH_CAT.utilidad.color, yv]].forEach(([arr, col, ly]) => {
    s += `<circle cx="${x(last)}" cy="${y(arr[last])}" r="4" fill="${col}" stroke="#fefdf5" stroke-width="2"/>`;
    s += `<text x="${x(last) + 8}" y="${ly + 4}" font-size="11" font-weight="700" fill="#2d3a1e" font-family="JetBrains Mono, monospace">${fmtShort(arr[last])}</text>`;
  });

  s += `<line id="dash-cross" x1="0" x2="0" y1="${mt}" y2="${mt + ph}" stroke="#2d3a1e" stroke-width="1" style="display:none"/>`;
  s += `<circle id="dash-dot-v" r="4" fill="${DASH_CAT.utilidad.color}" stroke="#fefdf5" stroke-width="2" style="display:none"/>`;
  s += `<circle id="dash-dot-e" r="4" fill="${DASH_CAT.gastos.color}" stroke="#fefdf5" stroke-width="2" style="display:none"/>`;
  s += `<rect x="${ml}" y="0" width="${pw}" height="${H}" fill="transparent" style="cursor:crosshair"
    onmousemove="dashHover(event.clientX)" ontouchstart="dashHover(event.touches[0].clientX)" ontouchmove="dashHover(event.touches[0].clientX)" onmouseleave="dashHoverOut()"/>`;
  s += '</svg><div class="dash-tip" id="dash-tip"></div>';
  host.innerHTML = s;
}

function dashHover(clientX) {
  const c = dashChart, host = document.getElementById("dash-chart");
  if (!c || !host) return;
  const rel = clientX - host.getBoundingClientRect().left;
  const d = Math.min(Math.max(Math.round((rel - c.ml) / c.pw * (c.days - 1)) + 1, 1), c.last);
  const cx = c.x(d);
  const cross = document.getElementById("dash-cross"), dv = document.getElementById("dash-dot-v"), de = document.getElementById("dash-dot-e");
  cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.style.display = "";
  dv.setAttribute("cx", cx); dv.setAttribute("cy", c.y(c.acV[d])); dv.style.display = "";
  de.setAttribute("cx", cx); de.setAttribute("cy", c.y(c.acE[d])); de.style.display = "";
  const dif = c.acV[d] - c.acE[d];
  const dow = DAYS_ES[new Date(currentYear, currentMonth, d).getDay()];
  const tip = document.getElementById("dash-tip");
  tip.innerHTML = `<div style="font-weight:700;margin-bottom:2px">${dow} ${d} de ${MONTHS[currentMonth]}</div>
    Ventas acum.: <b>${fmt(c.acV[d])}</b><br>Egresos acum.: <b>${fmt(c.acE[d])}</b><br>
    ${dif >= 0 ? "Utilidad" : "Pérdida"}: <b>${fmt(dif)}</b>
    <div style="opacity:.75;margin-top:4px;font-size:11px">Ese día: vendió ${fmt(c.ventasDia[d])} · gastó ${fmt(c.egresosDia[d])}</div>`;
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(cx - tw / 2, 0), c.W - tw) + "px";
  tip.style.top = Math.max(Math.min(c.y(c.acV[d]), c.y(c.acE[d])) - tip.offsetHeight - 12, 0) + "px";
}
function dashHoverOut() {
  ["dash-cross", "dash-dot-v", "dash-dot-e", "dash-tip"].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = "none"; });
}

let dashResizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(dashResizeTimer);
  dashResizeTimer = setTimeout(() => { if (currentTab === "dashboard") drawDashChart(); }, 150);
});

// ============ RESUMEN ============
function renderResumen() {
  const key = getKey();
  const days = daysInMonth(currentMonth, currentYear);
  const v = data.ventas?.[key] || {};
  const g = data.gastos?.[key] || [];
  const m = data.mercancia?.[key] || [];
  const f = fijosDelMes();
  
  let totE = 0, totB = 0;
  for (let d = 1; d <= days; d++) { totE += (v[d]?.efectivo||0); totB += (v[d]?.bancolombia||0); }
  const adicionales = data.adicionales?.[key] || [];
  totE += adicionales.reduce((s,x) => s+(x.efectivo||0), 0);
  totB += adicionales.reduce((s,x) => s+(x.bancolombia||0), 0);
  const totVentas = totE + totB;
  const totGastos = g.reduce((s,x) => s+(x.valor||0), 0);
  const totMerc = m.reduce((s,x) => s+(x.costo||0), 0);
  const totFijos = f.reduce((s,x) => s+(x.value||0), 0);
  const totalEgresos = totGastos + totMerc + totFijos;
  const utilidad = totVentas - totalEgresos;
  
  let html = `<h3 class="section-title">Resumen — ${MONTHS[currentMonth]} ${currentYear}</h3>`;
  
  // Ingresos
  html += '<div style="margin-bottom:20px"><div class="sum-section-label">Ingresos</div><div class="sum-grid3">';
  html += `<div class="summary-card" style="background:#eef5e6;border:2px solid #3a5f1c22"><div class="label" style="color:#3a5f1c">Efectivo</div><div class="value" style="color:#3a5f1c">${fmt(totE)}</div></div>`;
  html += `<div class="summary-card" style="background:#e4f0f9;border:2px solid #1a527622"><div class="label" style="color:#1a5276">Bancolombia</div><div class="value" style="color:#1a5276">${fmt(totB)}</div></div>`;
  html += `<div class="summary-card" style="background:#e8f2dc;border:2px solid #2d501622"><div class="label" style="color:#2d5016">Total Ventas</div><div class="value" style="color:#2d5016">${fmt(totVentas)}</div></div>`;
  html += '</div></div>';
  
  // Egresos
  html += '<div style="margin-bottom:20px"><div class="sum-section-label">Egresos</div><div class="sum-grid4">';
  html += `<div class="summary-card" style="background:#fce8e8;border:2px solid #8b1a1a22"><div class="label" style="color:#8b1a1a">Gastos Variables</div><div class="value" style="color:#8b1a1a">${fmt(totGastos)}</div></div>`;
  html += `<div class="summary-card" style="background:#fdf1dc;border:2px solid #7a4f0e22"><div class="label" style="color:#7a4f0e">Mercancía</div><div class="value" style="color:#7a4f0e">${fmt(totMerc)}</div></div>`;
  html += `<div class="summary-card" style="background:#f5e6fa;border:2px solid #5c1a6e22"><div class="label" style="color:#5c1a6e">Gastos Fijos</div><div class="value" style="color:#5c1a6e">${fmt(totFijos)}</div></div>`;
  html += `<div class="summary-card" style="background:#fce4e4;border:2px solid #6b1a1a22"><div class="label" style="color:#6b1a1a">Total Egresos</div><div class="value" style="color:#6b1a1a">${fmt(totalEgresos)}</div></div>`;
  html += '</div></div>';
  
  // Utilidad
  const uBg = utilidad >= 0 ? "linear-gradient(135deg,#2d5016,#4a7c2e)" : "linear-gradient(135deg,#6b1a1a,#8b2a2a)";
  const uEmoji = utilidad >= 0 ? "📈" : "📉";
  const uLabel = utilidad >= 0 ? "Utilidad Neta" : "Pérdida Neta";
  html += `<div class="utilidad-bar" style="background:${uBg}">
    <div><div class="u-label">${uLabel}</div><div class="u-val">${fmt(utilidad)}</div></div>
    <div class="u-icon">${uEmoji}</div>
  </div>`;
  
  // Desglose fijos
  html += '<div style="margin-top:20px"><div class="sum-section-label">Desglose Gastos Fijos</div>';
  f.forEach(item => {
    const pres = fijoPresupuesto(item, days);
    html += `<div class="detail-row"><span class="dr-name">${esc(fijoNombre(item))}</span><span class="dr-val" style="color:#5c1a6e">${fmt(item.value)}${pres > (item.value || 0) ? ` <span style="color:#8a9670;font-weight:500">de ${fmt(pres)}</span>` : ""}</span></div>`;
  });
  html += '</div>';
  
  // Últimas compras
  if (m.length > 0) {
    html += '<div style="margin-top:20px"><div class="sum-section-label">Últimas Compras de Mercancía</div>';
    sortByFecha([...m]).slice(0, 5).forEach(item => {
      const prov = item.proveedor ? ` (${item.proveedor})` : "";
      html += `<div class="detail-row"><span class="dr-name"><strong>${fmtFecha(item.fecha)}</strong> — ${item.producto||"Sin nombre"}${prov}</span><span class="dr-val" style="color:#7a4f0e">${fmt(item.costo)}</span></div>`;
    });
    html += '</div>';
  }
  
  document.getElementById("tab-resumen").innerHTML = html;
}

// Init
updateMonthLabel();
initData();
